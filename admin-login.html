<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Gasici Mito Dev</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d0d18;--surface:rgba(18,18,40,.85);--text:#e0e0f5;
  --muted:#6060a0;--border:rgba(255,255,255,.08);--card:rgba(18,18,45,.9);
  --g:0,200,110;--b:80,130,255;--p:150,80,255;--pk:200,80,140;--y:200,160,30;
}
*, *::before, *::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;overflow:hidden}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
a{color:inherit;text-decoration:none;cursor:none}
button{cursor:none;border:none;background:none;font:inherit;color:inherit}
input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.75rem 1rem;width:100%;outline:none}
input:focus{border-color:rgba(var(--g),.6);box-shadow:0 0 0 3px rgba(var(--g),.15)}
::placeholder{color:var(--muted)}
label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.5rem;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:6px;font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;transition:all .2s;width:100%}
.btn-primary{background:rgba(var(--g),1);color:#061210;border:none}
.btn-primary:hover:not(:disabled){background:#fff;transform:translateY(-1px);box-shadow:0 4px 16px rgba(var(--g),.3)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.input-group{position:relative}
.input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.input-group input{padding-left:3rem}
.toggle-password{position:absolute;right:1rem;top:50%;transform:translateY(-50%);color:var(--muted);cursor:none;background:none;border:none;padding:.5rem}
.toggle-password:hover{color:rgba(var(--g),1)}
.logo{font-weight:900;font-size:clamp(1.5rem,4vw,2.5rem);letter-spacing:-.04em;line-height:1}
.logo em{color:transparent;-webkit-text-stroke:2px var(--text);font-style:normal}
.subtitle{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:.5rem}
.alert{padding:.75rem 1rem;border-radius:6px;font-size:.8rem;display:flex;align-items:center;gap:.5rem}
.alert-error{background:rgba(255,60,90,.1);border:1px solid rgba(255,60,90,.3);color:rgba(255,60,90,1)}
.alert-error svg{color:rgba(255,60,90,1)}
.remember{display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:var(--muted);cursor:pointer}
.remember input{width:auto;accent-color:rgba(var(--g),1)}
.forgot{text-align:right;font-size:.75rem;color:var(--muted);transition:color .2s}
.forgot:hover{color:rgba(var(--g),1)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:rgba(var(--g),1);border-radius:50%;animation:spin .8s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="cur-dot" style="width:10px;height:10px;background:var(--text);border-radius:50%;position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .2s,height .2s"></div>
<div id="cur-ring" style="width:40px;height:40px;border:1.5px solid rgba(42,42,90,.28);border-radius:50%;position:fixed;z-index:9998;pointer-events:none;transform:translate(-50%,-50%);transition:opacity .3s"></div>

<div class="min-h-screen flex items-center justify-center p-4 relative z-10" x-data="loginApp()" x-init="init()">
<div class="w-full max-w-md">
<div class="text-center mb-10">
<div class="logo">Gasici <em>Mito</em> Dev</div>
<div class="subtitle">Admin Dashboard</div>
</div>

<div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-8" x-show="!mfaRequired" x-transition>
<div class="mb-8 text-center">
<h1 class="font-bold text-2xl mb-2">Connexion</h1>
<p class="text-[var(--muted)]">Entrez vos identifiants pour accéder au dashboard</p>
</div>

<template x-if="errorMessage">
<div class="alert alert-error mb-6" role="alert"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><span x-text="errorMessage"></span></div>
</template>

<form @submit.prevent="handleLogin" class="space-y-5" x-data="loginForm()">
<div class="input-group">
<label for="email">Email</label>
<span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
<input type="email" id="email" x-model="email" placeholder="gasicihome@gmail.com" required autocomplete="email" @keydown.enter.prevent="handleLogin">
</div>

<div class="input-group">
<label for="password">Mot de passe</label>
<span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
<input :type="showPassword ? 'text' : 'password'" id="password" x-model="password" placeholder="••••••••" required autocomplete="current-password" @keydown.enter.prevent="handleLogin">
<button type="button" class="toggle-password" @click="showPassword = !showPassword" aria-label="Afficher/masquer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" :class="{hidden: showPassword}" x-show="!showPassword"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden" x-show="showPassword"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-5.52 0-10-4.48-10-10S6.48 2 12 2c2.5 0 4.84 1 6.36 2.64"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
</div>

<div class="flex items-center justify-between">
<label class="remember"><input type="checkbox" x-model="rememberMe"> Se souvenir</label>
<a href="#" class="forgot" @click.prevent="showForgot = true">Mot de passe oublié ?</a>
</div>

<button type="submit" class="btn btn-primary" :disabled="loading">
<span x-show="loading"><span class="spinner mr-2"></span>Connexion...</span>
<span x-show="!loading">Se connecter</span>
</button>
</form>

<div class="mt-6 text-center">
<p class="text-[var(--muted)] text-sm">Retour au <a href="index.html" class="underline hover:text-[rgba(var(--g),1)]">portfolio</a></p>
</div>
</div>

<div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-8" x-show="mfaRequired" x-transition>
<div class="mb-8 text-center">
<h1 class="font-bold text-2xl mb-2">Authentification à 2 facteurs</h1>
<p class="text-[var(--muted)]">Entrez le code à 6 chiffres de votre application d'authentification</p>
</div>

<template x-if="errorMessage">
<div class="alert alert-error mb-6" role="alert"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><span x-text="errorMessage"></span></div>
</template>

<form @submit.prevent="handleMFA" class="space-y-5" x-data="mfaForm()">
<div class="input-group">
<label for="mfa-code">Code à 6 chiffres</label>
<span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
<input type="text" id="mfa-code" x-model="code" placeholder="000000" required autocomplete="one-time-code" maxlength="6" pattern="\d{6}" inputmode="numeric" @input="formatCode($event)" @keydown.enter.prevent="handleMFA" autofocus>
</div>

<button type="submit" class="btn btn-primary" :disabled="loading">
<span x-show="loading"><span class="spinner mr-2"></span>Vérification...</span>
<span x-show="!loading">Valider</span>
</button>
</form>

<p class="mt-4 text-center text-sm text-[var(--muted)]"><button @click="backToLogin" class="underline hover:text-[rgba(var(--g),1)]">← Retour à la connexion</button></p>
</div>

<template x-if="showForgot">
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" @click.self="showForgot=false" x-transition:opacity>
<div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 max-w-md w-full" x-transition>
<div class="flex items-center justify-between mb-4"><h2 class="font-bold">Réinitialiser le mot de passe</h2><button @click="showForgot=false" class="icon-btn"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<p class="text-[var(--muted)] mb-4">Entrez votre email pour recevoir un lien de réinitialisation.</p>
<form @submit.prevent="handleForgot" class="space-y-4">
<div class="input-group"><label for="forgot-email">Email</label><span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/></svg></span><input type="email" id="forgot-email" x-model="forgotEmail" required autocomplete="email"></div>
<div class="flex gap-3"><button type="submit" class="btn btn-primary flex-1" :disabled="forgotLoading"><span x-show="forgotLoading"><span class="spinner mr-2"></span>Envoi...</span><span x-show="!forgotLoading">Envoyer le lien</span></button><button type="button" class="btn btn-secondary" @click="showForgot=false">Annuler</button></div>
</form>
</div></div>
</template>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
document.addEventListener('alpine:init', () => {
Alpine.data('loginApp', () => ({
mfaRequired: false,
showForgot: false,
errorMessage: '',
loading: false,
forgotLoading: false,

loginForm() {
return {
email: 'gasicihome@gmail.com',
password: '',
rememberMe: false,
showPassword: false,
async handleLogin() {
this.$root.errorMessage = '';
this.$root.loading = true;
try {
const { auth } = window.SupabaseClient;
const { data, error } = await auth.signIn(this.email, this.password);
if (error) throw error;
if (data.session) {
const isAdmin = await auth.isAdmin();
if (!isAdmin) {
await auth.signOut();
this.$root.errorMessage = 'Accès non autorisé : droits admin requis';
return;
}
window.location.href = 'admin-dashboard.html';
}
} catch (e) {
this.$root.errorMessage = e.message;
} finally {
this.$root.loading = false;
}
}
}
},

mfaForm() {
return {
code: '',
loading: false,
formatCode(e) {
e.target.value = e.target.value.replace(/\D/g, '').slice(0,6);
},
async handleMFA() {
this.$root.errorMessage = '';
this.loading = true;
try {
const { auth } = window.SupabaseClient;
const { error } = await supabase.auth.verifyOtp({
token: this.code,
type: 'totp'
});
if (error) throw error;
window.location.href = 'admin-dashboard.html';
} catch (e) {
this.$root.errorMessage = e.message;
} finally {
this.loading = false;
}
}
}
},

forgotForm() {
return {
forgotEmail: '',
forgotLoading: false,
async handleForgot() {
this.$root.errorMessage = '';
this.forgotLoading = true;
try {
const { auth } = window.SupabaseClient;
const { error } = await supabase.auth.resetPasswordForEmail(this.forgotEmail, {
redirectTo: window.location.origin + '/admin-reset-password.html'
});
if (error) throw error;
alert('Lien de réinitialisation envoyé !');
this.$root.showForgot = false;
} catch (e) {
this.$root.errorMessage = e.message;
} finally {
this.forgotLoading = false;
}
}
}
},

init() {
const hash = window.location.hash;
if (hash.includes('type=totp') || hash.includes('type=recovery')) {
this.mfaRequired = true;
}
}
}))});

function supabase() {
return window.SupabaseClient?.auth?.supabase;
}
</script>
</body>
</html>
