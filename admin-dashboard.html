<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Gasici Mito Dev</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.13.5/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d0d18;--surface:rgba(18,18,40,.85);--text:#e0e0f5;
  --muted:#6060a0;--border:rgba(255,255,255,.08);--card:rgba(18,18,45,.9);
  --g:0,200,110;--b:80,130,255;--p:150,80,255;--pk:200,80,140;--y:200,160,30;
  --sidebar-w:280px;--header-h:64px;
}
*, *::before, *::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;overflow:hidden}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
a{color:inherit;text-decoration:none;cursor:none}
button{cursor:none;border:none;background:none;font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.6rem .8rem;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:rgba(var(--g),.6);box-shadow:0 0 0 3px rgba(var(--g),.15)}
::placeholder{color:var(--muted)}
label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.35rem;font-weight:600}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:.75rem 1rem;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-size:.65rem}
tr:hover td{background:rgba(var(--g),.03)}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.05em;padding:.15rem .5rem;border-radius:3px;border:1px solid var(--border);background:var(--surface)}
.badge-green{border-color:rgba(var(--g),.3);color:rgba(var(--g),1)}
.badge-blue{border-color:rgba(var(--b),.3);color:rgba(var(--b),1)}
.badge-purple{border-color:rgba(var(--p),.3);color:rgba(var(--p),1)}
.badge-yellow{border-color:rgba(var(--y),.3);color:rgba(var(--y),1)}
.badge-red{border-color:rgba(255,60,90,.3);color:rgba(255,60,90,1)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.1rem;border-radius:6px;font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;transition:all .2s}
.btn-primary{background:rgba(var(--g),1);color:#061210;border:none}
.btn-primary:hover{background:#fff;transform:translateY(-1px);box-shadow:0 4px 16px rgba(var(--g),.3)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:rgba(var(--g),.4);color:rgba(var(--g),1)}
.btn-danger{background:rgba(255,60,90,.1);color:rgba(255,60,90,1);border:1px solid rgba(255,60,90,.3)}
.btn-danger:hover{background:rgba(255,60,90,1);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid transparent}
.btn-ghost:hover{color:rgba(var(--g),1);background:rgba(var(--g),.08)}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--border);color:var(--muted);transition:all .2s}
.icon-btn:hover{border-color:rgba(var(--g),.4);color:rgba(var(--g),1);background:rgba(var(--g),.08)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;transform:scale(.95);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border)}
.modal-title{font-weight:800;font-size:1.1rem}
.modal-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--border);color:var(--muted);transition:all .2s}
.modal-close:hover{border-color:rgba(255,60,90,.4);color:rgba(255,60,90,1);background:rgba(255,60,90,.08);transform:rotate(90deg)}
.modal-body{padding:1.5rem;overflow-y:auto;flex:1}
.modal-footer{display:flex;justify-content:flex-end;gap:.75rem;padding:1rem 1.5rem;border-top:1px solid var(--border);background:var(--surface)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.form-group.full-width{grid-column:1/-1}
.tag-input{display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;min-height:44px}
.tag-input:focus-within{border-color:rgba(var(--g),.4)}
.tag-item{display:inline-flex;align-items:center;gap:.3rem;background:rgba(var(--g),.15);color:rgba(var(--g),1);padding:.15rem .5rem .15rem .35rem;border-radius:4px;font-size:.65rem;font-family:'Space Mono',monospace}
.tag-item button{margin-left:.25rem;padding:0;color:inherit;opacity:.7}
.tag-item button:hover{opacity:1}
.tag-input input{flex:1;min-width:120px;border:none;background:transparent;padding:.2rem 0}
.empty-state{text-align:center;padding:3rem;color:var(--muted)}
.empty-state svg{width:64px;height:64px;margin-bottom:1rem;opacity:.5}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:all .3s}
.card:hover{border-color:rgba(var(--g),.2);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.card-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-title{font-weight:700;font-size:.9rem}
.card-body{padding:1.25rem}
.card-footer{padding:.75rem 1.25rem;border-top:1px solid var(--border);background:var(--surface);display:flex;justify-content:flex-end;gap:.5rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem}
.stat-value{font-weight:900;font-size:2rem;color:rgba(var(--g),1);line-height:1}
.stat-label{font-family:'Space Mono',monospace;font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:.4rem}
.sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;color:var(--muted);border-radius:8px;margin:.2rem 1rem;transition:all .2s;position:relative;overflow:hidden}
.sidebar-link::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(var(--g),1);transform:scaleY(0);transform-origin:bottom;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.sidebar-link:hover,.sidebar-link.active{color:var(--text);background:rgba(var(--g),.08)}
.sidebar-link:hover::before,.sidebar-link.active::before{transform:scaleY(1);transform-origin:top}
.sidebar-link svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sidebar-badge{margin-left:auto;font-family:'Space Mono',monospace;font-size:.55rem;background:rgba(var(--g),.15);color:rgba(var(--g),1);padding:.1rem .4rem;border-radius:4px}
.page-enter{opacity:0;transform:translateY(20px)}
.page-enter-active{opacity:1;transform:translateY(0);transition:all .4s cubic-bezier(.25,.46,.45,.94)}
.page-leave{opacity:1;transform:translateY(0)}
.page-leave-active{opacity:0;transform:translateY(-20px);transition:all .3s cubic-bezier(.55,.06,.68,.19)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:rgba(var(--g),1);border-radius:50%;animation:spin .8s linear infinite}
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%);transition:transform .3s ease}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:block}
}
@media(max-width:768px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body x-data="adminApp()" x-init="init()">
<div x-show="sidebarOpen" class="sidebar-overlay fixed inset-0 z-40 bg-black/50" @click="sidebarOpen=false" x-transition:opacity x-cloak></div>

<aside class="sidebar fixed inset-y-0 left-0 z-50 w-[var(--sidebar-w)] bg-[var(--surface)] border-r border-[var(--border)] flex flex-col" :class="{open: sidebarOpen}">
<div class="flex items-center justify-between h-[var(--header-h)] px-4 border-b border-[var(--border)]">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full border-2 border-[var(--text)] flex items-center justify-center font-mono text-xs font-bold">GM</div>
<span class="font-bold text-sm">Admin</span>
</div>
<button class="icon-btn lg:hidden" @click="sidebarOpen=false"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
</div>
<nav class="flex-1 overflow-y-auto p-2" x-ref="nav">
<a href="#" class="sidebar-link" @click.prevent="navigate('dashboard')" :class="{active: page==='dashboard'}"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
<a href="#" class="sidebar-link" @click.prevent="navigate('projects')" :class="{active: page==='projects'}"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>Projets <span class="sidebar-badge" x-text="projectsCount"></span></a>
<a href="#" class="sidebar-link" @click.prevent="navigate('skills')" :class="{active: page==='skills'}"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Compétences</a>
<a href="#" class="sidebar-link" @click.prevent="navigate('about')" :class="{active: page==='about'}"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>À propos</a>
<a href="#" class="sidebar-link" @click.prevent="navigate('cv')" :class="{active: page==='cv'}"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>CV</a>
<a href="#" class="sidebar-link" @click.prevent="navigate('contact')" :class="{active: page==='contact'}"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Contact</a>
<a href="#" class="sidebar-link" @click.prevent="navigate('media')" :class="{active: page==='media'}"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Médias</a>
<a href="#" class="sidebar-link" @click.prevent="navigate('admins')" :class="{active: page==='admins'}"><svg viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 1 1 0 5.292M15 21H3v-1a6 6 0 0 1 12 0v1z"/></svg>Admins <span class="sidebar-badge" x-text="adminsCount"></span></a>
<a href="#" class="sidebar-link" @click.prevent="navigate('audit')" :class="{active: page==='audit'}"><svg viewBox="0 0 24 24"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>Audit Logs</a>
</nav>
<div class="p-4 border-t border-[var(--border)]">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-[rgba(var(--g),.15)] flex items-center justify-center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(var(--g),1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg></div>
<div><div class="font-medium text-xs" x-text="currentUser?.email || 'Non connecté'"></div><div class="font-mono text-[.55rem] text-[var(--muted)]" x-text="currentUserRole"></div></div>
</div>
<button class="icon-btn" @click="signOut" title="Déconnexion"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
</div>
</aside>

<main class="ml-[var(--sidebar-w)] min-h-screen flex flex-col" :class="{'lg:ml-[var(--sidebar-w)]': true}">
<header class="fixed top-0 right-0 left-[var(--sidebar-w)] h-[var(--header-h)] z-30 bg-[var(--surface)]/80 backdrop-blur-sm border-b border-[var(--border)] flex items-center justify-between px-6 lg:px-8" style="width: calc(100% - var(--sidebar-w))">
<div class="flex items-center gap-4">
<button class="icon-btn lg:hidden" @click="sidebarOpen=true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
<h1 class="font-bold text-lg" x-text="pageTitle"></h1>
</div>
<div class="flex items-center gap-3">
<button class="icon-btn" @click="refreshData" :disabled="loading" title="Rafraîchir"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
<div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-[var(--surface)] border border-[var(--border)]">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(var(--g),1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
<span class="font-mono text-xs text-[rgba(var(--g),1)]" x-text="currentUserRole"></span>
</div>
</div>
</header>

<div class="pt-[calc(var(--header-h)+2rem)] px-6 lg:px-8 pb-8" x-show="!loadingAuth" x-transition>
<template x-if="page==='dashboard'"><div x-html="renderDashboard()"></div></template>
<template x-if="page==='projects'"><div x-html="renderProjects()"></div></template>
<template x-if="page==='skills'"><div x-html="renderSkills()"></div></template>
<template x-if="page==='about'"><div x-html="renderAbout()"></div></template>
<template x-if="page==='cv'"><div x-html="renderCV()"></div></template>
<template x-if="page==='contact'"><div x-html="renderContact()"></div></template>
<template x-if="page==='media'"><div x-html="renderMedia()"></div></template>
<template x-if="page==='admins'"><div x-html="renderAdmins()"></div></template>
<template x-if="page==='audit'"><div x-html="renderAudit()"></div></template>
</div>

<div x-show="loadingAuth" class="fixed inset-0 z-50 flex items-center justify-center bg-[var(--bg)]" x-transition:opacity>
<div class="text-center"><div class="spinner mx-auto mb-4"></div><p class="text-[var(--muted)]">Vérification de l'authentification...</p></div>
</div>

<div class="modal-overlay" :class="{open: modalOpen}" @click.self="closeModal" x-cloak>
<div class="modal" @click.outside="closeModal" x-ref="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modal-header"><h2 class="modal-title" id="modalTitle" x-text="modalTitle"></h2><button class="modal-close" @click="closeModal" aria-label="Fermer"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<div class="modal-body" x-html="modalContent"></div>
<div class="modal-footer" x-html="modalFooter"></div>
</div>
</div>

<template x-if="toastMessage"><div class="fixed bottom-6 right-6 z-50" x-transition x-transition:enter="transition-opacity duration-300" x-transition:enter-start="opacity-0 translate-y-4" x-transition:leave="transition-opacity duration-200" x-transition:leave-end="opacity-0">
<div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 flex items-center gap-3 min-w-[280px] max-w-[400px] shadow-2xl" :class="{'border-[rgba(var(--g),.4)]': toastType==='success', 'border-[rgba(255,60,90,.4)]': toastType==='error'}">
<svg class="w-5 h-5 flex-shrink-0" :class="{'text-[rgba(var(--g),1)]': toastType==='success', 'text-[rgba(255,60,90,1)]': toastType==='error'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
<span class="text-sm" x-text="toastMessage"></span>
</div></div></template>
</main>

<script src="supabase-client.js"></script>
<script>
document.addEventListener('alpine:init', () => {
Alpine.data('adminApp', () => ({
page: 'dashboard',
pageTitle: 'Dashboard',
sidebarOpen: false,
modalOpen: false,
modalTitle: '',
modalContent: '',
modalFooter: '',
modalResolve: null,
toastMessage: '',
toastType: 'success',
loading: false,
loadingAuth: true,
currentUser: null,
currentUserRole: '—',
projectsCount: 0,
adminsCount: 0,

async init() {
await this.checkAuth();
await this.loadCounts();
},

async checkAuth() {
const { auth } = window.SupabaseClient;
const session = await auth.getSession();
if (!session) {
window.location.href = 'admin-login.html';
return;
}
this.currentUser = session.user;
const isAdmin = await auth.isAdmin();
if (!isAdmin) {
await auth.signOut();
window.location.href = 'admin-login.html';
return;
}
const role = await this.getUserRole();
this.currentUserRole = role === 'super_admin' ? 'Super Admin' : 'Admin';
this.loadingAuth = false;
},

async getUserRole() {
const { db } = window.SupabaseClient;
const { data } = await db.select('admin_users', { filters: { id: this.currentUser.id } });
return data?.[0]?.role || 'admin';
},

async loadCounts() {
const { tables } = window.SupabaseClient;
const [projects, admins] = await Promise.all([
tables.projects.getAll(),
tables.admin_users.getAll()
]);
this.projectsCount = projects.data?.length || 0;
this.adminsCount = admins.data?.length || 0;
},

navigate(page) {
this.page = page;
const titles = {
dashboard: 'Dashboard',
projects: 'Projets',
skills: 'Compétences',
about: 'À propos',
cv: 'CV',
contact: 'Contact',
media: 'Médias',
admins: 'Admins',
audit: 'Audit Logs'
};
this.pageTitle = titles[page] || 'Admin';
this.sidebarOpen = false;
window.scrollTo(0,0);
},

refreshData() { this.loadCounts(); },

async signOut() {
const { auth } = window.SupabaseClient;
await auth.signOut();
window.location.href = 'admin-login.html';
},

showToast(message, type = 'success') {
this.toastMessage = message;
this.toastType = type;
setTimeout(() => this.toastMessage = '', 4000);
},

openModal(title, content, footer = '') {
this.modalTitle = title;
this.modalContent = content;
this.modalFooter = footer;
this.modalOpen = true;
},

closeModal() {
this.modalOpen = false;
this.modalContent = '';
this.modalFooter = '';
if (this.modalResolve) {
this.modalResolve(false);
this.modalResolve = null;
}
},

confirm(message) {
return new Promise((resolve) => {
this.modalResolve = resolve;
this.openModal('Confirmation', `<p class="text-[var(--muted)]">${message}</p>`, `
<button class="btn btn-secondary" @click="closeModalConfirm(false)">Annuler</button>
<button class="btn btn-danger" @click="closeModalConfirm(true)">Confirmer</button>
`);
});
},

closeModalConfirm(result) {
if (this.modalResolve) {
this.modalResolve(result);
this.modalResolve = null;
}
this.modalOpen = false;
},

// ========== DASHBOARD ==========
renderDashboard() {
return `
<div class="page-enter-active">
<div class="stats-grid">
<div class="stat-card"><div class="stat-value" x-text="projectsCount"></div><div class="stat-label">Projets</div></div>
<div class="stat-card"><div class="stat-value" x-text="skillsCount || 0"></div><div class="stat-label">Compétences</div></div>
<div class="stat-card"><div class="stat-value" x-text="adminsCount"></div><div class="stat-label">Admins</div></div>
<div class="stat-card"><div class="stat-value" x-text="mediaCount || 0"></div><div class="stat-label">Médias</div></div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
<div class="card"><div class="card-header"><h3 class="card-title">Actions rapides</h3></div>
<div class="card-body space-y-3">
<button class="btn btn-primary w-full justify-center" @click="navigate('projects'); this.showToast('Redirection vers Projets...')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg> Ajouter un projet</button>
<button class="btn btn-secondary w-full justify-center" @click="navigate('skills')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg> Gérer compétences</button>
<button class="btn btn-secondary w-full justify-center" @click="navigate('media')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/></svg> Uploader médias</button>
<button class="btn btn-secondary w-full justify-center" @click="navigate('contact')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/></svg> Mettre à jour contact</button>
</div></div>
<div class="card"><div class="card-header"><h3 class="card-title">Derniers projets</h3></div>
<div class="card-body">
<div x-show="!recentProjects?.length" class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/></svg><p>Aucun projet</p></div>
<table><thead><tr><th>Projet</th><th>Catégorie</th><th>Stack</th><th>Status</th><th></th></tr></thead>
<tbody>
<template x-for="p in recentProjects" :key="p.id">
<tr><td class="font-medium">${p.title}</td><td>${p.category || '—'}</td><td><div class="flex flex-wrap gap-1">${p.stack?.slice(0,3).map(s => `<span class="badge">${s}</span>`).join('')}</div></td><td><span class="badge" :class="p.published ? 'badge-green' : 'badge-yellow'" x-text="p.published ? 'Publié' : 'Brouillon'"></span></td><td><button class="icon-btn" @click="editProject(p)" title="Modifier"></button></td></tr>
</template>
</tbody></table></div></div></div></div>`;
},

async loadRecentProjects() {
const { tables } = window.SupabaseClient;
const { data } = await tables.projects.getAll();
this.recentProjects = data?.slice(0,5) || [];
},

// ========== PROJECTS ==========
renderProjects() {
return `
<div class="page-enter-active">
<div class="flex items-center justify-between mb-6"><h2 class="font-bold text-xl">Projets</h2>
<button class="btn btn-primary" @click="openProjectModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg> Nouveau projet</button></div>
<div class="card overflow-hidden">
<table><thead><tr><th>#</th><th>Projet</th><th>Catégorie</th><th>Stack</th><th>Image</th><th>Status</th><th>Ordre</th><th></th></tr></thead>
<tbody>
<template x-for="(p, i) in projects" :key="p.id">
<tr><td class="font-mono text-[var(--muted)]" x-text="i+1"></td>
<td><div class="font-medium" x-text="p.title"></div><div class="text-xs text-[var(--muted)] truncate max-w-[300px]" x-text="p.description"></div></td>
<td><span class="badge badge-blue" x-text="p.category || '—'"></span></td>
<td><div class="flex flex-wrap gap-1"><template x-for="s in p.stack" :key="s"><span class="badge" x-text="s"></span></template></div></td>
<td><template x-if="p.image_url"><img :src="p.image_url" alt="" class="w-16 h-10 object-cover rounded"/></template><template x-if="!p.image_url"><span class="text-[var(--muted)] text-xs">—</span></template></td>
<td><span class="badge" :class="p.published ? 'badge-green' : 'badge-yellow'" x-text="p.published ? 'Publié' : 'Brouillon'"></span></td>
<td><input type="number" :value="p.sort_order" class="w-16 text-center" @change="updateProjectOrder(p.id, $event.target.value)"></td>
<td><div class="flex items-center gap-1"><button class="icon-btn" @click="editProject(p)" title="Modifier"></button><button class="icon-btn" @click="deleteProject(p.id)" title="Supprimer"></button></div></td>
</tr>
</template>
</tbody></table>
<div x-show="!projects.length" class="empty-state p-8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="mx-auto mb-2"><rect x="2" y="3" width="20" height="14" rx="2"/></svg><p>Aucun projet</p></div></div></div>`;
},

async loadProjects() {
const { tables } = window.SupabaseClient;
const { data } = await tables.projects.getAll();
this.projects = data || [];
this.projectsCount = data?.length || 0;
},

openProjectModal(project = null) {
this.editingProject = project;
const isEdit = !!project;
this.modalTitle = isEdit ? `Modifier : ${project.title}` : 'Nouveau projet';
this.modalContent = this.getProjectFormHTML(project);
this.modalFooter = `
<button class="btn btn-secondary" @click="closeModal">Annuler</button>
<button class="btn btn-primary" :disabled="saving" @click="saveProject()"><span x-show="saving"><span class="spinner mr-2"></span>Sauvegarde...</span><span x-show="!saving">${isEdit ? 'Mettre à jour' : 'Créer'}</span></button>
`;
this.modalOpen = true;
this.$nextTick(() => this.initTagInput('projectStack'));
},

getProjectFormHTML(p) {
const isEdit = !!p;
return `
<form @submit.prevent="saveProject" class="space-y-4" x-data="projectForm(${JSON.stringify(p || {})})">
<div class="form-grid">
<div class="form-group"><label>Titre *</label><input type="text" x-model="form.title" :value="form.title" required placeholder="Nom du projet"></div>
<div class="form-group"><label>Catégorie</label><input type="text" x-model="form.category" placeholder="Marketplace, Mobile, API..."></div>
</div>
<div class="form-group"><label>Description</label><textarea x-model="form.description" rows="3" placeholder="Description du projet..."></textarea></div>
<div class="form-grid">
<div class="form-group"><label>Repo URL</label><input type="url" x-model="form.repo_url" placeholder="https://github.com/..."></div>
<div class="form-group"><label>Demo URL</label><input type="url" x-model="form.demo_url" placeholder="https://demo.com"></div>
</div>
<div class="form-group"><label>Stack (tags)</label>
<div class="tag-input" x-ref="tagInput">
<template x-for="tag in form.stack" :key="tag"><span class="tag-item" x-text="tag"><button type="button" @click="removeTag(tag)">&times;</button></span></template>
<input type="text" placeholder="Ajouter tag + Entrée" @keydown.enter.prevent="addTag($event.target.value)" @blur="addTag($event.target.value)" x-ref="tagInputField">
</div></div>
<div class="form-grid">
<div class="form-group"><label>Image URL</label><input type="url" x-model="form.image_url" placeholder="https://..."></div>
<div class="form-group"><label>Image Alt</label><input type="text" x-model="form.image_alt" placeholder="Texte alternatif"></div>
</div>
<div class="form-grid">
<div class="form-group"><label>Ordre</label><input type="number" x-model.number="form.sort_order" min="0"></div>
<div class="form-group flex items-end"><label class="block mb-2">Publié</label><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" x-model="form.published" class="w-4 h-4 accent-[rgb(var(--g))]"><span>Visible sur le portfolio</span></label></div>
<div class="form-group flex items-end"><label class="block mb-2">Mis en avant</label><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" x-model="form.featured" class="w-4 h-4 accent-[rgb(var(--g))]"><span>Projet vedette</span></label></div>
</div>
</form>`;
},

initTagInput(refName) {
this.$nextTick(() => {
const input = this.$refs[refName + 'Field'];
if (input) input.focus();
});
},

addTag(value) {
if (!value?.trim()) return;
if (!this.form.stack.includes(value.trim())) {
this.form.stack.push(value.trim());
}
if (this.$refs.tagInputField) this.$refs.tagInputField.value = '';
},

removeTag(tag) {
this.form.stack = this.form.stack.filter(t => t !== tag);
},

async saveProject() {
this.saving = true;
try {
const { tables } = window.SupabaseClient;
const payload = {
title: this.form.title,
description: this.form.description,
repo_url: this.form.repo_url,
demo_url: this.form.demo_url,
stack: this.form.stack,
image_url: this.form.image_url,
image_alt: this.form.image_alt,
category: this.form.category,
sort_order: this.form.sort_order,
published: this.form.published,
featured: this.form.featured
};
if (this.editingProject) {
await tables.projects.update(this.editingProject.id, payload);
this.showToast('Projet mis à jour');
} else {
await tables.projects.create(payload);
this.showToast('Projet créé');
}
this.closeModal();
await this.loadProjects();
} catch (e) {
console.error(e);
this.showToast(e.message, 'error');
} finally {
this.saving = false;
}
},

async editProject(p) {
this.openProjectModal(p);
},

async deleteProject(id) {
if (!await this.confirm('Supprimer ce projet ?')) return;
try {
const { tables } = window.SupabaseClient;
await tables.projects.delete(id);
this.showToast('Projet supprimé');
await this.loadProjects();
} catch (e) {
this.showToast(e.message, 'error');
}
},

async updateProjectOrder(id, order) {
const { tables } = window.SupabaseClient;
await tables.projects.update(id, { sort_order: parseInt(order) });
await this.loadProjects();
},

// ========== SKILLS ==========
renderSkills() {
return `
<div class="page-enter-active">
<div class="flex items-center justify-between mb-6"><h2 class="font-bold text-xl">Compétences</h2>
<button class="btn btn-primary" @click="openSkillModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg> Ajouter</button></div>
<div class="card overflow-hidden"><table><thead><tr><th>#</th><th>Nom</th><th>Catégorie</th><th>%</th><th>Ordre</th><th></th></tr></thead>
<tbody><template x-for="(s, i) in skills" :key="s.id"><tr><td class="font-mono text-[var(--muted)]" x-text="i+1"></td><td class="font-medium" x-text="s.name"></td><td x-text="s.category"></td><td><input type="number" :value="s.percentage" min="0" max="100" class="w-20 text-center" @change="updateSkill(s.id, {percentage: parseInt($event.target.value)})"></td><td><input type="number" :value="s.sort_order" class="w-16 text-center" @change="updateSkill(s.id, {sort_order: parseInt($event.target.value)})"></td><td><button class="icon-btn" @click="deleteSkill(s.id)" title="Supprimer"></button></td></tr></template></tbody></table></div></div>`;
},

async loadSkills() {
const { tables } = window.SupabaseClient;
const { data } = await tables.skills.getAll();
this.skills = data || [];
},

openSkillModal(skill = null) {
this.editingSkill = skill;
this.modalTitle = skill ? `Modifier : ${skill.name}` : 'Nouvelle compétence';
this.modalContent = `<form @submit.prevent="saveSkill" class="space-y-4" x-data="skillForm(${JSON.stringify(skill || {})})">
<div class="form-grid"><div class="form-group"><label>Nom *</label><input type="text" x-model="form.name" required></div><div class="form-group"><label>Catégorie *</label><input type="text" x-model="form.category" required placeholder="Frontend, Backend, Mobile..."></div></div>
<div class="form-grid"><div class="form-group"><label>Pourcentage *</label><input type="number" x-model.number="form.percentage" min="0" max="100" required></div><div class="form-group"><label>Ordre</label><input type="number" x-model.number="form.sort_order" min="0"></div></div>
</form>`;
this.modalFooter = `<button class="btn btn-secondary" @click="closeModal">Annuler</button><button class="btn btn-primary" @click="saveSkill">${skill ? 'Mettre à jour' : 'Créer'}</button>`;
this.modalOpen = true;
},

async saveSkill() {
const { tables } = window.SupabaseClient;
const payload = {name: this.form.name, category: this.form.category, percentage: this.form.percentage, sort_order: this.form.sort_order};
if (this.editingSkill) {await tables.skills.update(this.editingSkill.id, payload); this.showToast('Compétence mise à jour');}
else {await tables.skills.create(payload); this.showToast('Compétence créée');}
this.closeModal(); await this.loadSkills();
},

async deleteSkill(id) {if(!await this.confirm('Supprimer ?')) return; await window.SupabaseClient.tables.skills.delete(id); this.showToast('Supprimé'); await this.loadSkills();},

// ========== PLACEHOLDERS FOR OTHER PAGES ==========
renderAbout() {return `<div class="page-enter-active"><div class="card"><div class="card-header"><h3 class="card-title">À propos</h3></div><div class="card-body"><p class="text-[var(--muted)]">Éditeur de contenu "À propos" à implémenter.</p></div></div></div>`;},
renderCV() {return `<div class="page-enter-active"><div class="card"><div class="card-header"><h3 class="card-title">CV</h3></div><div class="card-body"><p class="text-[var(--muted)]">Éditeur CV (Expérience, Formation, Compétences, Stack, Langues, Intérêts) à implémenter.</p></div></div></div>`;},
renderContact() {return `<div class="page-enter-active"><div class="card"><div class="card-header"><h3 class="card-title">Contact</h3></div><div class="card-body"><p class="text-[var(--muted)]">Éditeur liens de contact à implémenter.</p></div></div></div>`;},
renderMedia() {return `<div class="page-enter-active"><div class="flex items-center justify-between mb-6"><h2 class="font-bold text-xl">Médias</h2><button class="btn btn-primary" @click="openMediaUpload()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg> Uploader</button></div><div class="card"><div class="card-body"><p class="text-[var(--muted)]">Galerie médias à implémenter.</p></div></div></div>`;},
renderAdmins() {return `<div class="page-enter-active"><div class="card"><div class="card-header"><h3 class="card-title">Admins</h3></div><div class="card-body"><p class="text-[var(--muted)]">Gestion admins à implémenter.</p></div></div></div>`;},
renderAudit() {return `<div class="page-enter-active"><div class="card"><div class="card-header"><h3 class="card-title">Audit Logs</h3></div><div class="card-body"><p class="text-[var(--muted)]">Logs d'audit à implémenter.</p></div></div></div>`;},

// ========== MEDIA UPLOAD ==========
openMediaUpload() {
this.modalTitle = 'Uploader une image';
this.modalContent = `<div x-data="mediaUpload()"><div class="drop-zone border-2 border-dashed border-[var(--border)] rounded-xl p-8 text-center" @dragover.prevent="dragging=true" @dragleave="dragging=false" @drop.prevent="handleDrop($event)" :class="{'border-[rgba(var(--g),.5)] bg-[rgba(var(--g),.05)]': dragging}"><svg class="w-12 h-12 mx-auto mb-4 text-[var(--muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><p class="text-[var(--muted)]">Glissez-déposez une image ou cliquez</p><input type="file" accept="image/*" @change="handleFile($event)" class="hidden" x-ref="fileInput"><button class="btn btn-secondary mt-4" @click="$refs.fileInput.click()">Choisir un fichier</button></div><div x-show="uploading" class="mt-4 text-center"><div class="spinner mx-auto mb-2"></div><p class="text-sm text-[var(--muted)]" x-text="uploadProgress"></p></div><div x-show="previewUrl" class="mt-4"><img :src="previewUrl" alt="Preview" class="max-h-64 mx-auto rounded-lg border border-[var(--border)]"></div></div>`;
this.modalFooter = `<button class="btn btn-secondary" @click="closeModal">Annuler</button><button class="btn btn-primary" :disabled="!previewUrl || uploading" @click="uploadMedia()">Uploader</button>`;
this.modalOpen = true;
},

// ========== DATA LOADERS ==========
async loadAllData() {
await Promise.all([
this.loadProjects(),
this.loadSkills(),
this.loadMedia()
]);
},

async loadMedia() {
const { tables } = window.SupabaseClient;
const { data } = await tables.media.getAll();
this.media = data || [];
this.mediaCount = data?.length || 0;
},

// Helper for Alpine components
projectForm(initial) {
return {
form: {
title: initial?.title || '',
description: initial?.description || '',
repo_url: initial?.repo_url || '',
demo_url: initial?.demo_url || '',
stack: initial?.stack || [],
image_url: initial?.image_url || '',
image_alt: initial?.image_alt || '',
category: initial?.category || '',
sort_order: initial?.sort_order || 0,
published: initial?.published ?? true,
featured: initial?.featured ?? false
},
addTag(value) { if(!value?.trim()) return; if(!this.form.stack.includes(value.trim())) this.form.stack.push(value.trim()); this.$refs.tagInputField.value = ''; },
removeTag(tag) { this.form.stack = this.form.stack.filter(t => t !== tag); }
};
},
skillForm(initial) {
return {
form: {
name: initial?.name || '',
category: initial?.category || '',
percentage: initial?.percentage || 80,
sort_order: initial?.sort_order || 0
}
};
},
mediaUpload() {
return {
dragging: false,
uploading: false,
uploadProgress: '',
previewUrl: null,
selectedFile: null,
handleFile(e) { const f = e.target.files[0]; if(f) this.setFile(f); },
handleDrop(e) { this.dragging = false; const f = e.dataTransfer.files[0]; if(f) this.setFile(f); },
setFile(f) { if(!f.type.startsWith('image/')) return; this.selectedFile = f; this.previewUrl = URL.createObjectURL(f); },
async uploadMedia() {
if(!this.selectedFile) return;
this.uploading = true;
this.uploadProgress = 'Upload...';
try {
const url = await window.SupabaseClient.utils.uploadImage(this.selectedFile, 'admin');
this.showToast('Image uploadée : ' + url);
this.closeModal();
await this.loadMedia();
} catch(e) { this.showToast(e.message, 'error'); }
finally { this.uploading = false; }
}
};
}
}))});
</script>
</body>
</html>
